<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Web Copilot Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f0d1a;
      color: #e2e0f0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .settings-container {
      background: #1e1b2e;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 450px;
      padding: 32px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      color: #c4b5fd;
    }
    .header svg {
      color: #a78bfa;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    select, input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #e2e0f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }
    select option {
      background: #1e1b2e;
      color: #e2e0f0;
    }
    .apikey-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .apikey-wrap input {
      flex: 1;
    }
    .toggle-key-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      color: #e2e0f0;
      transition: background 0.15s;
    }
    .toggle-key-btn:hover {
      background: rgba(139, 92, 246, 0.2);
    }
    .settings-link {
      font-size: 12px;
      color: #8b5cf6;
      text-decoration: none;
      display: inline-block;
      margin-top: 8px;
    }
    .settings-link:hover {
      color: #c4b5fd;
      text-decoration: underline;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #d1d5db;
      transition: all 0.15s;
    }
    .btn:hover {
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      border-color: rgba(139, 92, 246, 0.3);
    }
    .btn.primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-color: transparent;
      color: white;
    }
    .btn.primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      color: #34d399;
    }
    .status.error {
      color: #f87171;
    }
    .note {
      margin-top: 24px;
      font-size: 12px;
      color: #9ca3af;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="settings-container">
    <div class="header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <h1>AI Web Copilot Settings</h1>
    </div>

    <div class="form-group">
      <label>AI Provider</label>
      <select id="provider">
        <option value="openai">🤖 OpenAI (ChatGPT)</option>
        <option value="gemini">✨ Google Gemini</option>
        <option value="claude">🟠 Anthropic Claude</option>
        <option value="grok">𝕏 xAI Grok</option>
        <option value="mistral">💨 Mistral AI</option>
      </select>
    </div>

    <div class="form-group">
      <label>Model</label>
      <select id="model"></select>
    </div>

    <div class="form-group">
      <label>API Key</label>
      <div class="apikey-wrap">
        <input type="password" id="apikey" placeholder="Paste your API key here..." />
        <button id="toggle-key" class="toggle-key-btn" title="Show/hide key">👁</button>
      </div>
      <a id="get-key-link" class="settings-link" href="#" target="_blank">🔑 Get API Key</a>
    </div>

    <div class="actions">
      <button id="btn-test" class="btn">🔌 Test Connection</button>
      <button id="btn-save" class="btn primary">💾 Save Settings</button>
    </div>

    <div id="status" class="status"></div>

    <div class="note">
      🔒 <strong>Local-First Security:</strong> Your API key is stored securely in your browser's isolated extension storage. It is never sent anywhere except directly to the AI provider you selected.
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
